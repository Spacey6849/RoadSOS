// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// MAX_PATH redirect was attempted with `buildDir = "D:/b/${project.name}"`
// for non-app subprojects but caused two problems that combined to make
// release builds unbuildable:
//   1. The app's React Native Android-autolinking.cmake hard-codes codegen
//      JNI paths at `<node_modules>/<lib>/android/build/generated/source/
//      codegen/jni`. Redirecting buildDir puts those files under
//      `D:/b/<lib>/generated/source/codegen/jni` instead — CMake then fails
//      `app:configureCMakeRelWithDebInfo` with "not an existing directory"
//      for every redirected codegen dependency (async-storage, llama.rn,
//      reanimated, webview, worklets).
//   2. reanimated 4.x's CMake hard-codes the path to libworklets.so as
//      `<node_modules>/react-native-worklets/android/build/intermediates/
//      .../libworklets.so` — so worklets specifically had to be exempt
//      from the redirect anyway.
// Both paths assume the default buildDir. Building from `D:\rsos` (8-char
// prefix) gives enough headroom for CMake's object filenames without
// needing the redirect — typical lib path is ~120 chars including
// intermediates which stays under MAX_PATH=260.
// If you start hitting MAX_PATH again, the right fix is a junction
// (`mklink /J D:\rs D:\rsos`) to shorten the prefix further, not a
// buildDir override.

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
